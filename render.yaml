services:
  - type: web
    name: lobechat-ragib
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "3210"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROXY_URL
        value: "https://api.ragib.tech/v1"
      - key: ACCESS_CODE
        sync: false
      - key: OPENAI_MODEL_LIST
        value: "+devin/gpt-6-astra=GPT-6 Astra,+devin/gpt-5-6-sol=GPT-5.6 Sol,+devin/claude-opus-4-6=Claude Opus 4.6,+devin/claude-sonnet-4-6=Claude Sonnet 4.6,+devin/gemini-3-7-flash=Gemini 3.7 Flash,+devin/deepseek-v4-pro=DeepSeek V4 Pro,+kimi-k2.7-code=Kimi K2.7 Code"
